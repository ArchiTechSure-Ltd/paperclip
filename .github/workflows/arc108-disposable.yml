name: ARC-108 disposable exact-source verification
on:
  push:
    branches: [codex/arc108-disposable-verification]
    paths: [.github/workflows/arc108-disposable.yml]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2758ab91dc360b63ffd8e37feacc3c3181be45a5
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Identity and prerequisites
        run: |
          mkdir -p verification-evidence
          test "$(git rev-parse HEAD)" = "2758ab91dc360b63ffd8e37feacc3c3181be45a5"
          git rev-parse HEAD | tee verification-evidence/source.txt
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile
          git diff -- pnpm-lock.yaml > verification-evidence/lockfile.diff
          pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Individual focused receipts
        run: |
          python3 - <<'PY'
          import os, subprocess, pathlib, json
          out=pathlib.Path('verification-evidence').resolve()
          suites=['src/services/workspace-recovery.test.ts','src/__tests__/deferred-execution-receipt-work.test.ts']
          env={k:v for k,v in os.environ.items() if not(k.endswith('BASE_URL') and not v)}
          receipts=[]
          for suite in suites:
            name=pathlib.Path(suite).name
            with (out/(name+'.log')).open('w') as log:
              try:
                r=subprocess.run(['timeout','--kill-after=10s','600s','../node_modules/.bin/vitest','run','--config','vitest.config.ts','--testTimeout=30000','--hookTimeout=30000','--reporter=verbose','--reporter=json','--outputFile.json='+str(out/(name+'.json')),suite],cwd='server',env=env,stdout=log,stderr=subprocess.STDOUT)
                code=r.returncode
              except Exception as e:
                log.write(str(e));code=125
            (out/(name+'.exit')).write_text(str(code)+'\n')
            receipts.append({'suite':suite,'exit':code})
          (out/'results.json').write_text(json.dumps(receipts,indent=2))
          print(json.dumps(receipts,indent=2))
          raise SystemExit(any(r['exit'] for r in receipts))
          PY
      - name: Upload receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arc108-two-suite-${{ github.run_id }}
          path: verification-evidence/
          retention-days: 14
