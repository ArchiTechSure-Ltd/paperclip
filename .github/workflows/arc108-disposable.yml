name: ARC-108 disposable exact-source verification
on:
  push:
    branches: [codex/arc108-disposable-verification]
    paths: [.github/workflows/arc108-disposable.yml]
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2758ab91dc360b63ffd8e37feacc3c3181be45a5
          persist-credentials: false
      - name: Build exact candidate without publishing
        run: |
          mkdir -p verification-evidence
          test "$(git rev-parse HEAD)" = 2758ab91dc360b63ffd8e37feacc3c3181be45a5
          set -o pipefail
          docker build --target production --label org.opencontainers.image.revision=2758ab91dc360b63ffd8e37feacc3c3181be45a5 -t arc108:candidate . 2>&1 | tee verification-evidence/docker-build.log
          docker image inspect arc108:candidate > verification-evidence/image.json
      - name: Disposable container health
        run: |
          set +x
          export BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          export PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$BETTER_AUTH_SECRET"
          echo "::add-mask::$PAPERCLIP_TOOL_ACTION_SIGNING_SECRET"
          docker run -d --name arc108 -p 127.0.0.1:3100:3100 -e HOST=0.0.0.0 -e PORT=3100 -e PAPERCLIP_DEPLOYMENT_MODE=authenticated -e PAPERCLIP_DEPLOYMENT_EXPOSURE=private -e PAPERCLIP_PUBLIC_URL=http://localhost:3100 -e BETTER_AUTH_SECRET -e PAPERCLIP_TOOL_ACTION_SIGNING_SECRET arc108:candidate
          for attempt in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3100/api/health > verification-evidence/health.json; then exit 0; fi
            test "$(docker inspect -f '{{.State.Running}}' arc108)" = true || exit 1
            sleep 2
          done
          exit 1
      - name: Capture and remove disposable container
        if: always()
        run: |
          docker logs arc108 > verification-evidence/container.log 2>&1 || true
          docker inspect arc108 | python3 -c 'import sys,json; data=json.load(sys.stdin); [x["Config"].update(Env=[e.split("=",1)[0]+"=<redacted>" if e.split("=",1)[0] in ("BETTER_AUTH_SECRET","PAPERCLIP_TOOL_ACTION_SIGNING_SECRET") else e for e in x["Config"]["Env"]]) for x in data]; json.dump(data,sys.stdout,indent=2)' > verification-evidence/container.json
          docker rm -fv arc108 || true
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: arc108-docker-${{ github.run_id }}
          path: verification-evidence/
          retention-days: 14
