name: ACPX CI baseline comparison
on:
  pull_request:
    branches: [master]
    paths: ['.github/workflows/acpx-ci-baseline.yml']
permissions:
  contents: read
jobs:
  compare:
    name: ${{ matrix.source }} / ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [base, candidate]
        lane: [runner-static, server-5, server-7, chat-2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ matrix.source == 'base' && '92ec8fbe7c94a434fe2cf2b4bb3d0973946631df' || 'cde99620622a07df6bce83b751e3fd102baed4dd' }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 9.15.4
          run_install: false
      - name: Prepare toolchain and record identity
        run: |
          mkdir -p verification-evidence
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc libc6-dev pkg-config
          (cd packages/paperclip-runner && rustup show)
          toolchain=$(cd packages/paperclip-runner && rustup show active-toolchain | awk '{print $1}')
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            cat /etc/os-release
            node --version
            pnpm --version
            (cd packages/paperclip-runner && rustc --version && cargo --version)
          } | tee verification-evidence/identity.log
      - name: Install dependencies
        run: |
          set -o pipefail
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile 2>&1 | tee verification-evidence/resolution.log
          git diff -- pnpm-lock.yaml > verification-evidence/lockfile.diff
          pnpm install --frozen-lockfile 2>&1 | tee verification-evidence/install.log
      - name: Run original failing lane
        env:
          LANE: ${{ matrix.lane }}
        run: |
          set +e
          set -o pipefail
          case "$LANE" in
            runner-static)
              pnpm --filter @paperclipai/paperclip-runner check:static 2>&1 | tee verification-evidence/test.log
              ;;
            server-5)
              pnpm test:run:general -- --group general-server-without-chat --shard-index 5 --shard-count 12 2>&1 | tee verification-evidence/test.log
              ;;
            server-7)
              pnpm test:run:general -- --group general-server-without-chat --shard-index 7 --shard-count 12 2>&1 | tee verification-evidence/test.log
              ;;
            chat-2)
              pnpm test:run:general -- --group chat --shard-index 2 --shard-count 3 2>&1 | tee verification-evidence/test.log
              ;;
            *) exit 64 ;;
          esac
          result=$?
          echo "$result" > verification-evidence/test.exit
          exit "$result"
      - name: Upload comparison evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-baseline-${{ matrix.source }}-${{ matrix.lane }}-${{ github.run_id }}
          path: verification-evidence/
          retention-days: 14
          if-no-files-found: error
