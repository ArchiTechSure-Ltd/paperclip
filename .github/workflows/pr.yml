name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Use the reviewed fork workflow and its pinned compatible routing contract.
    # Repository workflow changes still require normal review.
    uses: architechsure-ltd/paperclip/.github/workflows/pr-trusted.yml@fb370d801f9aacd64709d5dbf059b8a99f5e1feb
