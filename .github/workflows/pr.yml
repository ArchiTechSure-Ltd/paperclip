name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci' || github.event.label.name == 'full-ci'
    # Master requires CODEOWNERS review for .github/**, including this workflow.
    # Pin the fork's compatible reviewed CI contract; upstream master can require newer source.
    uses: architechsure-ltd/paperclip/.github/workflows/pr-trusted.yml@92ec8fbe7c94a434fe2cf2b4bb3d0973946631df
